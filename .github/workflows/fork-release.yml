name: Fork release

# macOS arm64 desktop, Linux x64 desktop and Linux x64 CLI release for forks,
# then the same commit to the fork's iOS preview app (fork-ios-preview.sh).
# The macOS app must be Developer ID signed and notarized, or Squirrel.Mac
# refuses to install updates; the release fails rather than ship it unsigned.
# release.yml only runs in pingdotgg/t3code. X.Y.Z and X.Y.Z-fork.N become the
# latest release that installed fork apps update to; any other version is a
# prerelease.
# X.Y.Z-fork.N sorts before X.Y.Z, so a fork release uses the next patch.
# With `pr` set it is a dev build instead: that PR's head ships on the Nightly
# update track as X.Y.Z-nightly.YYYYMMDD.RUN, X.Y.Z being the next fork release
# it previews, and moves the `update-feed` pointer that nightly installs read.
# It never becomes the latest release and skips the iOS preview app.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Leave blank for the next X.Y.Z-fork.N."
        required: false
        type: string
      pr:
        description: "Pull request number to ship as a Nightly dev build instead. Leave version blank."
        required: false
        type: string

concurrency:
  group: fork-release-${{ github.event_name == 'push' && github.ref_name || inputs.pr && format('pr-{0}', inputs.pr) || inputs.version }}
  cancel-in-progress: false

permissions:
  # release-desktop.yml reads this run's artifact list.
  actions: read
  contents: read
  # Dev builds read the pull request they ship.
  pull-requests: read

jobs:
  resolve:
    name: Resolve version
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dev_build: ${{ steps.meta.outputs.dev_build }}
      title: ${{ steps.meta.outputs.title }}
      clerk_publishable_key: ${{ steps.public_config.outputs.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ steps.public_config.outputs.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ steps.public_config.outputs.T3CODE_RELAY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .env.example
            .github/scripts/fork-release-version.cjs
          sparse-checkout-cone-mode: false

      - id: meta
        name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##')"
          ref="$GITHUB_SHA"
          title=""
          dev_build=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            requested="${GITHUB_REF_NAME#v}"
          else
            requested="${INPUT_VERSION#v}"
          fi
          if [[ -n "$INPUT_PR" ]]; then
            if [[ -n "$requested" || ! "$INPUT_PR" =~ ^[0-9]+$ ]]; then
              echo "::error::Give a pull request number and no version for a dev build."
              exit 1
            fi
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")"
            # The build runs with the signing secrets, so only this repository's branches qualify.
            if [[ "$(jq -r .head.repo.full_name <<< "$pr")" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::PR #$INPUT_PR's head is not a branch of $GITHUB_REPOSITORY."
              exit 1
            fi
            ref="$(jq -r .head.sha <<< "$pr")"
            next="$(node .github/scripts/fork-release-version.cjs "" <<< "$tags")"
            # Date, then this workflow's run number, so each dev build sorts after the last.
            version="${next%%-*}-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
            title="v$version · PR #$INPUT_PR @ ${ref:0:7}"
            dev_build=true
          else
            version="$(node .github/scripts/fork-release-version.cjs "$requested" <<< "$tags")"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a release version such as 1.2.3 or 1.2.3-fork.1."
            exit 1
          fi
          if [[ "$dev_build" == "false" && "$version" =~ -nightly\. ]]; then
            echo "::error::Nightly versions come only from dev builds. Give a pull request number instead."
            exit 1
          fi
          prerelease=true
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-fork\.[0-9]+)?$ ]]; then prerelease=false; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "ref=$ref"
            echo "prerelease=$prerelease"
            echo "dev_build=$dev_build"
            echo "title=${title:-v$version}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $ref (prerelease: $prerelease, dev build: $dev_build)."

      - name: Require macOS signing configuration
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER MACOS_PROVISIONING_PROFILE APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::macOS signing is not configured. Missing: ${missing[*]}."
            exit 1
          fi

      # The production T3 Connect identifiers that official builds bake in.
      - id: public_config
        name: Read T3 Connect public config
        shell: bash
        run: |
          set -euo pipefail
          for name in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL; do
            value="$(sed -n "s/^${name}=//p" .env.example)"
            if [[ -z "$value" ]]; then
              echo "::error::.env.example has no $name."
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done

  build_bundle:
    name: Build JS bundle
    needs: [resolve]
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.resolve.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.resolve.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.resolve.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.resolve.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      # @t3tools/desktop#build compiles the Linux browser secret helper, which needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop

      # The npm launcher manifest, which the fork publishes as a release asset instead of to npm.
      # Track switches read its version and database migration (apps/server/src/cloud/npmRelease.ts).
      - name: Write release manifest
        run: |
          node scripts/build-npm-launcher.ts --version "${{ needs.resolve.outputs.version }}" --output-dir "$RUNNER_TEMP/npm"
          mkdir -p release-manifest
          cp "$RUNNER_TEMP/npm/t3/package.json" release-manifest/t3code.json
          cat release-manifest/t3code.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release-manifest/t3code.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [resolve, build_bundle]
    if: github.repository != 'pingdotgg/t3code'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: ${{ needs.resolve.outputs.dev_build == 'true' && 'nightly' || 'stable' }}
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.resolve.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.resolve.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.resolve.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.resolve.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [resolve, build_bundle]
    if: github.repository != 'pingdotgg/t3code'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: ${{ needs.resolve.outputs.dev_build == 'true' && 'nightly' || 'stable' }}
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.resolve.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.resolve.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.resolve.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.resolve.outputs.relay_url }}
      label: macOS arm64
      runner: macos-latest
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false
      launch_check: true
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}

  # Checks the zip the updater downloads, the way Squirrel.Mac and Gatekeeper will.
  verify_mac_signature:
    name: Verify macOS signature
    needs: [desktop_mac_arm64]
    if: github.repository != 'pingdotgg/t3code'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac-arm64
          path: mac

      - name: Verify signature, notarization and staple
        shell: bash
        run: |
          set -euo pipefail
          zips=(mac/*.zip)
          ditto -x -k "${zips[0]}" unpacked
          app=(unpacked/*.app)
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          codesign -d -r- "${app[0]}"
          spctl -a -vv -t exec "${app[0]}"
          xcrun stapler validate "${app[0]}"

  release:
    name: Publish GitHub Release
    needs: [resolve, desktop_linux_x64, desktop_mac_arm64, verify_mac_signature]
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Download release manifest
        uses: actions/download-artifact@v8
        with:
          name: release-manifest
          path: release-assets

      # Installers verify archives against this file, so it is written from the bytes that get uploaded.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Drafted first so no updater sees the release before every asset is attached.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REF: ${{ needs.resolve.outputs.ref }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          TITLE: ${{ needs.resolve.outputs.title }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          shopt -s nullglob extglob
          files=(release-assets/!(builder-debug).yml release-assets/*.AppImage release-assets/*.dmg release-assets/*.zip release-assets/*.blockmap release-assets/*.tar.gz release-assets/SHA256SUMS release-assets/t3code.json)
          flags=(--latest)
          if [[ "$PRERELEASE" == "true" ]]; then flags=(--prerelease --latest=false); fi
          notes=(--generate-notes)
          if [[ -n "$PR" ]]; then
            pr_title="$(gh pr view "$PR" --json title --jq .title)"
            notes=(--notes "Dev build of #$PR ($pr_title) at $REF, for the Nightly update track. Not a fork release.")
          fi
          gh release create "$TAG" --draft --target "$REF" --title "$TITLE" "${notes[@]}" "${flags[@]}" "${files[@]}"
          gh release edit "$TAG" --draft=false "${flags[@]}"

      # Nightly installs read this fixed pointer to find the newest nightly, as upstream's do
      # (docs/operations/03_release.md#update-feed). Never delete the `update-feed` release.
      - name: Point the update feed at this dev build
        if: needs.resolve.outputs.dev_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '{tag_name, name, body}' > nightly.json
          gh release view update-feed > /dev/null 2>&1 ||
            gh release create update-feed --prerelease --latest=false --title "Update feed" \
              --notes "Nightly fork installs read nightly.json here to find the newest dev build. Do not delete it."
          gh release upload update-feed nightly.json --clobber
          gh release edit update-feed --draft=false --prerelease --latest=false

  # Ships the release to the fork's ad hoc iOS preview app: an OTA update, or a new
  # build when native code changed. A failure here never fails the release.
  # Dev builds skip it: the free Expo plan allows 15 builds a month.
  ios_preview:
    name: iOS preview app
    needs: [resolve, release]
    if: github.repository != 'pingdotgg/t3code' && needs.resolve.outputs.dev_build != 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...

      - name: Update or build the iOS preview app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: .github/scripts/fork-ios-preview.sh --message "$TAG ($(git rev-parse --short HEAD))"
