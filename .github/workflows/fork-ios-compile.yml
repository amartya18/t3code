name: Fork iOS compile check

# Builds the development client for an arm64 iOS Simulator on a free GitHub-hosted
# runner: prebuild, pod install, unsigned xcodebuild. It proves the voice-mode
# module, its SwiftPM dependency and the app link before an EAS build is spent,
# then runs the module's self-test on a simulator with the real models.
on:
  push:
    branches-ignore: [main]
    paths:
      - apps/mobile/modules/t3-voice-mode/**
      - .github/workflows/fork-ios-compile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator build
    if: github.repository == 'amartya18/t3code'
    # macos-latest is the macos-26 image. Expo SDK 58 doesn't build with macos-15's Xcode 26.3.
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      APP_VARIANT: development
      MOBILE_VERSION_POLICY: appVersion
      T3CODE_IOS_PERSONAL_TEAM: "0"
      CI: "1"
      EXPO_NO_GIT_STATUS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Dependency scripts run below, so the checkout token goes first (see mobile-dev-client.yml).
      - name: Drop checkout credentials
        run: |
          git config --local --get-regexp '^includeif\..*\.path$' | while read -r key file; do
            rm -f "$file"
            git config --local --unset-all "$key"
          done
          git config --local --name-only --get-regexp '^http\..*\.extraheader$' | while read -r key; do
            git config --local --unset-all "$key"
          done
          rm -f "$RUNNER_TEMP"/git-credentials-*.config

      # EAS builds with Xcode 27.1; use 27.x when the image has it, else its newest Xcode.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Voice logic checks
        working-directory: apps/mobile/modules/t3-voice-mode
        run: |
          xcrun swiftc ios/AudioRing.swift ios/SpeechGate.swift ios/MicLevel.swift ios-tests/main.swift -o "$RUNNER_TEMP/voice-logic"
          "$RUNNER_TEMP/voice-logic"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...

      - name: Prebuild
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform ios --no-install

      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace ios/T3CodeDev.xcworkspace \
            -scheme T3CodeDev \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            -quiet build

      # A module autolinking skipped would still build green, so look for it in the binary.
      - name: Check the module is linked
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/T3CodeDev.app"
          for binary in "$app/T3CodeDev" "$app/T3CodeDev.debug.dylib"; do
            if [ -f "$binary" ]; then nm -U "$binary" | xcrun swift-demangle >> "$RUNNER_TEMP/symbols.txt"; fi
          done
          wc -l "$RUNNER_TEMP/symbols.txt"
          for symbol in T3VoiceMode.T3VoiceModeModule T3VoiceMode.VoiceSelfTestLauncher FluidAudio.AsrManager FluidAudio.VocabularyBoostingSession FluidAudio.KokoroAneManager; do
            if ! grep -m 1 -F "$symbol" "$RUNNER_TEMP/symbols.txt"; then
              echo "::error::$symbol is not in the app binary"
              exit 1
            fi
          done

      # The widget extension builds only as the app's dependency; a skipped splice would still pass.
      - name: Check the voice call control is built
        run: |
          appex="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/T3CodeDev.app/PlugIns/ExpoWidgetsTarget.appex"
          ls "$appex"
          for binary in "$appex/ExpoWidgetsTarget" "$appex/ExpoWidgetsTarget.debug.dylib"; do
            if [ -f "$binary" ]; then nm -U "$binary" | xcrun swift-demangle >> "$RUNNER_TEMP/widget-symbols.txt"; fi
          done
          grep -m 1 -F "StartVoiceCallControl" "$RUNNER_TEMP/widget-symbols.txt" || { echo "::error::The control is not in the widget extension"; exit 1; }
          grep -rl "StartVoiceCallIntent" "$appex/Metadata.appintents" || { echo "::error::The control's intent is not in the App Intents metadata"; exit 1; }

      - name: Restore voice models
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/voice-models
          key: voice-models-${{ hashFiles('apps/mobile/modules/t3-voice-mode/ios/ModelStore.swift') }}

      - name: Self-test on a simulator
        timeout-minutes: 45
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/T3CodeDev.app"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          runtime="$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier')"
          udid="$(xcrun simctl list devices available -j | jq -r --arg runtime "$runtime" '.devices[$runtime][] | select(.name | startswith("iPhone")) | .udid' | head -n 1)"
          echo "runtime $runtime, device $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          data="$(xcrun simctl get_app_container "$udid" "$bundle" data)"
          echo "data=$data" >> "$GITHUB_ENV"
          if [ -d "$RUNNER_TEMP/voice-models" ]; then
            mkdir -p "$data/Library/Application Support"
            cp -R "$RUNNER_TEMP/voice-models" "$data/Library/Application Support/T3VoiceMode"
          fi
          SIMCTL_CHILD_T3_VOICE_SELF_TEST=1 xcrun simctl launch --console-pty "$udid" "$bundle" 2>&1 \
            | tr -d '\r' | tee "$RUNNER_TEMP/self-test.log" | grep '^T3_VOICE_SELF_TEST' || true
          line="$(grep -m 1 '^T3_VOICE_SELF_TEST {' "$RUNNER_TEMP/self-test.log" | sed 's/^T3_VOICE_SELF_TEST //')"
          if [ -z "$line" ]; then
            tail -n 80 "$RUNNER_TEMP/self-test.log"
            echo "::error::The self-test printed no result"
            exit 1
          fi
          echo "$line" > "$RUNNER_TEMP/self-test.json"
          jq 'del(.vadFrames)' "$RUNNER_TEMP/self-test.json"
          jq -e '.ok == true' "$RUNNER_TEMP/self-test.json" > /dev/null || { echo "::error::The self-test failed"; exit 1; }

      - name: Keep the self-test audio
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-self-test
          path: |
            ${{ runner.temp }}/self-test.log
            ${{ runner.temp }}/self-test.json
            ${{ env.data }}/Library/Caches/T3VoiceSelfTest
          if-no-files-found: ignore

      - name: Copy the voice models out
        id: copied
        if: always() && steps.models.outputs.cache-hit != 'true' && env.data != ''
        run: |
          src="$data/Library/Application Support/T3VoiceMode"
          if [ -d "$src/Models" ]; then
            rm -rf "$RUNNER_TEMP/voice-models"
            cp -R "$src" "$RUNNER_TEMP/voice-models"
            du -sh "$RUNNER_TEMP/voice-models"/Models/*
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save voice models
        if: always() && steps.copied.outputs.done == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/voice-models
          key: voice-models-${{ hashFiles('apps/mobile/modules/t3-voice-mode/ios/ModelStore.swift') }}
